name: Feature request
description: Something Itaja should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would solve it for you?
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
